{% extends 'base.html' %}
{% block content %}
<section class="account-page">
  <header class="page-intro">
    <p class="eyebrow">{{ labels.register_eyebrow }}</p>
    <h1>{{ labels.register_title }}</h1>
    <p>{{ labels.register_intro }}</p>
  </header>
  {% if errors %}<div class="form-errors" role="alert">{% for error in errors %}<p>{{ error }}</p>{% endfor %}</div>{% endif %}
  <form class="account-form" method="post">
    {% csrf_token %}
    <label class="field"><span>{{ labels.name_label }}</span><input type="text" name="customer_name" autocomplete="name" maxlength="100" value="{{ values.customer_name }}" required></label>
    <label class="field"><span>{{ labels.phone_label }}</span><input type="tel" name="phone" inputmode="numeric" autocomplete="tel-national" pattern="[0-9]{10}" minlength="10" maxlength="10" value="{{ values.phone }}" required></label>
    <label class="field"><span>{{ labels.password_label }}</span><input type="password" name="password" autocomplete="new-password" minlength="8" required><small>{{ labels.password_placeholder }}</small></label>
    <button class="button button-primary" type="submit">{{ labels.register_cta }} <span aria-hidden="true">&rarr;</span></button>
  </form>
  <p class="account-switch">{{ labels.have_account }} <a href="{% url 'account-login' %}">{{ labels.login_cta }}</a></p>
</section>
{% endblock %}
